# Validación del frontend en cada push que lo modifica (specs/002-ci-cd-pipeline).
name: frontend

on:
  push:
    # '**' excluye los push de tags, en los que GitHub ignora `paths` (research R2).
    branches: ['**']
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

# En main se serializa sin cancelar; en otras ramas solo importa el último commit (research R10).
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests unitarios
        run: npm test

      - name: Build
        run: npm run build

      - name: Prueba de arranque
        run: |
          npm run preview -- --port 4173 --strictPort > frontend.log 2>&1 &
          body=$(curl --silent --fail --retry 30 --retry-delay 2 --retry-connrefused \
            --retry-all-errors --max-time 5 http://localhost:4173/) || {
            echo "::error::El frontend compilado no respondió en /"
            exit 1
          }
          if ! grep -q '<div id="root">' <<< "$body"; then
            echo "::error::La página principal no contiene <div id=\"root\">"
            exit 1
          fi

      - name: Log del frontend
        if: failure()
        run: cat frontend.log || true

  # Solo main; los secretos viven en el Environment `production`, que solo admite main
  # (FR-019a). VITE_API_URL de producción llega con `vercel pull`.
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://horario-web-eosin.vercel.app
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
      PROD_WEB_URL: https://horario-web-eosin.vercel.app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Comprobar secretos
        env:
          VERCEL_TOKEN_WEB: ${{ secrets.VERCEL_TOKEN_WEB }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID_WEB: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
        run: |
          missing=0
          for name in VERCEL_TOKEN_WEB VERCEL_ORG_ID VERCEL_PROJECT_ID_WEB; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta el secreto $name"
              missing=1
            fi
          done
          exit $missing

      - name: Instalar CLI de Vercel
        run: npm install --global vercel@65.2.0

      - name: Descargar configuración
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_WEB }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build de Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_WEB }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      # Un reintento ante un fallo de la plataforma (FR-013a).
      - name: Desplegar en Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_WEB }}
        run: |
          for attempt in 1 2; do
            if url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"); then
              echo "Desplegado \`horario-web\`: $url" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$attempt" -eq 1 ]; then
              echo "::warning::Falló el despliegue en Vercel; se reintenta en 15 s"
              sleep 15
            fi
          done
          echo "::error::El despliegue en Vercel falló también en el reintento"
          exit 1

      # Sin reintento ni rollback: si falla, el job queda en rojo (FR-013b).
      - name: Verificar producción
        run: |
          body=$(curl --silent --fail --retry 30 --retry-delay 2 --retry-connrefused \
            --retry-all-errors --max-time 5 "$PROD_WEB_URL/") || {
            echo "::error::Producción no respondió en /"
            exit 1
          }
          if ! grep -q '<div id="root">' <<< "$body"; then
            echo "::error::La página de producción no contiene <div id=\"root\">"
            exit 1
          fi
