# Integración backend + frontend en cada push a main; informativo, no bloquea despliegues
# (specs/002-ci-cd-pipeline, FR-017/FR-018). Comprobaciones en contracts/smoke-checks.md.
name: integration

on:
  push:
    branches: [main]

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: horario
          POSTGRES_PASSWORD: horario
          POSTGRES_DB: horario_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U horario"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # El backend usa el puerto 3001 (no el 3000 por defecto del cliente) para que I3 pruebe
    # que VITE_API_URL se aplicó en el build (research R8).
    env:
      API_URL: http://localhost:3001
      WEB_URL: http://localhost:4173
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: 'Backend: instalar y compilar'
        working-directory: backend
        run: |
          npm ci
          npm run build

      - name: 'Backend: arrancar'
        working-directory: backend
        env:
          DATABASE_URL: postgresql://horario:horario@localhost:5432/horario_ci?schema=public
          JWT_SECRET: ci-secret
          PORT: '3001'
          CORS_ORIGIN: http://localhost:4173
        run: |
          npx prisma migrate deploy
          node dist/main > backend.log 2>&1 &

      - name: 'Frontend: instalar y compilar'
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:3001
        run: |
          npm ci
          npm run build

      - name: 'Frontend: servir'
        working-directory: frontend
        run: npm run preview -- --port 4173 --strictPort > frontend.log 2>&1 &

      - name: Health del backend
        run: |
          body=$(curl --silent --fail --retry 30 --retry-delay 2 --retry-connrefused \
            --retry-all-errors --max-time 5 "$API_URL/api/health") || {
            echo "::error::El backend no respondió en /api/health"
            exit 1
          }
          if [ "$body" != '{"status":"ok"}' ]; then
            echo "::error::Respuesta inesperada de /api/health: $body"
            exit 1
          fi

      - name: Frontend servido
        run: |
          body=$(curl --silent --fail --retry 30 --retry-delay 2 --retry-connrefused \
            --retry-all-errors --max-time 5 "$WEB_URL/") || {
            echo "::error::El frontend compilado no respondió en /"
            exit 1
          }
          if ! grep -q '<div id="root">' <<< "$body"; then
            echo "::error::La página principal no contiene <div id=\"root\">"
            exit 1
          fi

      - name: Frontend apunta al backend
        run: |
          if ! grep -rq "$API_URL" frontend/dist/assets; then
            echo "::error::El bundle del frontend no contiene $API_URL (¿VITE_API_URL no se aplicó?)"
            exit 1
          fi

      - name: CORS acepta el origen del frontend
        run: |
          headers=$(curl --silent --output /dev/null --dump-header - -X OPTIONS \
            "$API_URL/api/auth/login" \
            -H "Origin: $WEB_URL" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: authorization,content-type" | tr -d '\r')
          status=$(head -n 1 <<< "$headers" | awk '{print $2}')
          if [ "$status" != "204" ]; then
            echo "::error::El preflight CORS devolvió $status (se esperaba 204)"
            exit 1
          fi
          if ! grep -qi "^access-control-allow-origin: $WEB_URL$" <<< "$headers"; then
            echo "::error::El backend no aceptó el origen $WEB_URL"
            exit 1
          fi

      - name: CORS rechaza otros orígenes
        run: |
          headers=$(curl --silent --output /dev/null --dump-header - -X OPTIONS \
            "$API_URL/api/auth/login" \
            -H "Origin: http://evil.example" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: authorization,content-type" | tr -d '\r')
          if grep -qi "^access-control-allow-origin:" <<< "$headers"; then
            echo "::error::El backend aceptó un origen no permitido (http://evil.example)"
            exit 1
          fi

      - name: Logs
        if: failure()
        run: |
          cat backend/backend.log || true
          cat frontend/frontend.log || true
